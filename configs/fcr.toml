[[comparisons]]
name = "no_penalty"
label = "No penalty (all providers)"
all_providers = { penalty_eur_per_missing_mw_block = 0.0 }

[[comparisons]]
name = "lower_uncertainty"
label = "Uncertain renewable: lower uncertainty"
providers = { renewable_uncertain = { variance_mw2 = 0.04 } }
