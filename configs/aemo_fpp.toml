# Matched-scenario assessment of two frozen FPP gain policies.
base_config = "fcr.toml"
scenario_name = "fi_endogenous"
source_profile = "ideal_frequency_gain_game"
follower_config = "fpp_followers.toml"

[scenario]
final_time_s = 300.0
output_time_step_s = 0.05
maximum_solver_step_s = 0.1

[numerics]
relative_tolerance = 1e-11
absolute_tolerance = 1e-13

[assessment]
samples = 8
seed = 20261026
# Independent streams for design, holdout, delivery and mixed-policy draws.

# Reference defaults to each generator's solved ANDES P_i,0 for the whole horizon.
# No endpoint targets or reference ramps are prescribed.

# Prices are intentionally absent: export CF * RCR / 12 in MW h.
# Optional [prices] requires raise_per_mw_h, lower_per_mw_h, currency,
# source, date (ISO), scope, evidence, price_basis, units="currency/(MW h)".
# See docs/AEMO_FPP.md. No price is inferred from the FCR block price.
