# Fixed-policy assessment; source constants are defined by the documented profile.
base_config = "fcr.toml"
scenario_name = "fi_endogenous"
source_profile = "aemo_fcf_v1.2_2025-06-08"

[scenario]
final_time_s = 300.0
output_time_step_s = 0.05
maximum_solver_step_s = 0.1

[numerics]
relative_tolerance = 1e-11
absolute_tolerance = 1e-13

[assessment]
samples = 8
seed = 20261026
# SeedSequence children: 0=assessment, 1=independent representative delivery.
# No policy selection on either stream.

[[schedules]]
name = "constant"

[[schedules]]
name = "balanced_ramp"
# Prescribed offsets from solved ANDES powers, at the 300-second endpoint.
# Full availability support is retained; these are illustrative scenario data.
[schedules.target_offsets_mw]
conventional_1 = [1.0]
conventional_2 = [-1.0]

# Prices are intentionally absent: export CF * RCR / 12 in MW h.
# Optional [prices] requires raise_per_mw_h, lower_per_mw_h, currency,
# source, date (ISO), scope, evidence, price_basis, units="currency/(MW h)".
# See docs/AEMO_FPP.md. No price is inferred from the FCR block price.
