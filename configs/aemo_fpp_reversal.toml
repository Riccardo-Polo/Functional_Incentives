# Prescribed deficit-to-surplus experiment; all other inputs match aemo_fpp.toml.
base_config = "fcr.toml"
scenario_name = "fi_endogenous"
source_profile = "aemo_fcf_v1.2_2025-06-08"

[scenario]
final_time_s = 300.0
output_time_step_s = 0.05
maximum_solver_step_s = 0.1

[numerics]
relative_tolerance = 1e-11
absolute_tolerance = 1e-13

[assessment]
samples = 8
seed = 20261026

# Initial +10 MW deficit at 1 s is inherited. This is the new absolute level:
# a -17 MW change produces a net 7 MW surplus. The change is off both clocks.
[[disturbance_changes]]
time_s = 120.05
net_power_deficit_mw = -7.0

[[schedules]]
name = "constant"

[[schedules]]
name = "balanced_ramp"
[schedules.target_offsets_mw]
conventional_1 = [1.0]
conventional_2 = [-1.0]

# As in the preserved baseline, no external regulation price is assumed.
