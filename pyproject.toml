[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "functional-incentives"
version = "0.1.0"
description = "Functional incentives for frequency control"
requires-python = ">=3.11"
dependencies = [
    "numpy",
    "scipy",
    "matplotlib",
    "pandas",
    "pandapower",
]

[tool.setuptools.packages.find]
where = ["src"]